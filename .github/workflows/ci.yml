# CyberAsset Guard CI (ASSET-44): tests on the minimum and the current Python version,
# then the Docker deployment tests (plain and HTTPS profile).
name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"          # weekly (Mon 06:00 UTC): dependency + image vuln scan on main (ASSET-81)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff + mypy (ASSET-46)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Ruff lint            # fails the job on any violation (incl. a deliberate lint error)
        run: ruff check
      - name: Mypy type check      # app/assets, app/auth, app/audit (see pyproject.toml)
        run: mypy

  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]          # documented minimum and the version the image uses
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Configuration check
        run: python -m app.maintenance check
      - name: Run tests
        run: python -m pytest -q

  docker:
    name: Docker deployment
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Docker deployment tests (HTTP and HTTPS profile)
        env:
          CAG_TEST_DOCKER: "1"
        run: python -m pytest -q -k docker

  # Static analysis (ruff's flake8-bandit "S" rules) runs in the `lint` job above.
  # This job adds dependency (pip-audit) and container-image (Trivy) vulnerability
  # scanning. Runs on every PR/push and weekly on main (schedule). HIGH/CRITICAL
  # findings fail the build unless waived — see .trivyignore and
  # security/pip-audit-ignores.txt (waivers carry a reason and an expiry).
  security:
    name: security scan (pip-audit + Trivy) (ASSET-81)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt
      - name: Install runtime dependencies (the pinned set that ships) and pip-audit
        run: |
          python -m pip install --upgrade pip          # audit the app's deps, not an old bundled pip
          python -m pip install -r requirements.txt -c constraints.txt
          python -m pip install pip-audit
      - name: pip-audit (Python dependencies)
        shell: bash
        run: |
          mapfile -t ids < <(grep -vE '^\s*(#|$)' security/pip-audit-ignores.txt 2>/dev/null | awk '{print $1}')
          args=(); for id in "${ids[@]}"; do args+=(--ignore-vuln "$id"); done
          echo "Waived advisories: ${ids[*]:-none}"
          pip-audit "${args[@]}" --format json --output pip-audit-report.json || true   # report artifact
          pip-audit "${args[@]}"                                                        # non-zero exit fails the build
      - name: Build the image to scan
        run: docker build -t cyberasset-guard:scan .
      - name: Trivy image scan (HIGH/CRITICAL fail the build)
        # Run Trivy from its official image so there is no GitHub-Action version to guess
        # at; Dependabot's docker ecosystem can pin/update the tag. The daemon socket lets
        # Trivy read the locally built image. --output writes the report before the
        # non-zero exit, so the artifact is still produced when findings fail the build.
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" -w /work \
            aquasec/trivy:latest image \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile .trivyignore \
            --format json --output trivy-report.json \
            --exit-code 1 \
            cyberasset-guard:scan
      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-reports
          path: |
            pip-audit-report.json
            trivy-report.json
          if-no-files-found: ignore

  e2e:
    name: UI e2e (Playwright) (ASSET-83)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Install the Playwright browser
        run: python -m playwright install --with-deps chromium
      - name: Run UI e2e tests (headless, throwaway server + database)
        env:
          CAG_TEST_E2E: "1"
        run: python -m pytest -q tests/test_e2e_ui.py
