# Alembic configuration.
#
# When the application applies migrations (app/database.run_migrations) the
# database URL and script location are set programmatically. This file provides
# the defaults for running the `alembic` CLI directly from the project root,
# e.g. `alembic upgrade head` or `alembic stamp head`.
#
# No [loggers]/[handlers]/[formatters] sections on purpose: env.py does not call
# fileConfig, so Alembic never overrides the application's own logging setup.

[alembic]
script_location = alembic
# Put the project root on sys.path so env.py can `import app` when the CLI is
# run from the project root (e.g. `alembic upgrade head`, `alembic stamp head`).
prepend_sys_path = .
path_separator = os
sqlalchemy.url = sqlite:///cyberasset_guard.db
